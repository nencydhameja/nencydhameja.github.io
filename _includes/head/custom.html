<!-- Geo-blocking: hide the site from specific cities (client-side, best-effort).
     Uses ipwho.is for the city lookup; a ?access=<code> bypass whitelists a browser. -->
<script>
  (function () {
    var BLOCKED_CITIES = ["johnson city", "binghamton", "endicott", "vestal"];  // lowercase
    var BLOCKED_REGION = "new york";                                            // guards against same-named cities elsewhere
    var BYPASS_CODE    = "letmein";                                             // visit  ?access=letmein  once per browser

    try {
      var p = new URLSearchParams(location.search);
      if (p.get("access") === BYPASS_CODE) localStorage.setItem("geoBypass", "1");
      if (localStorage.getItem("geoBypass") === "1") return;   // whitelisted browser -> never blocked
    } catch (e) {}

    fetch("https://ipwho.is/")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.success === false) return;   // lookup failed or rate-limited -> do not block
        var city   = (d.city   ? d.city   : "").toLowerCase();
        var region = (d.region ? d.region : "").toLowerCase();
        if (BLOCKED_CITIES.indexOf(city) !== -1 && region === BLOCKED_REGION) blockPage();
      })
      .catch(function () {});

    function blockPage() {
      var html =
          '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center;background:#fff;">'
        + '<div><h1 style="font-size:2rem;">Access Restricted</h1>'
        + '<p style="color:#666;">This website is not available in your region.</p></div></div>';
      if (document.body) {
        document.body.innerHTML = html;                                   // body already parsed
      } else {
        window.addEventListener("DOMContentLoaded", function () {         // lookup beat the body -> wait
          document.body.innerHTML = html;
        });
      }
    }
  })();
</script>

<!-- end custom head snippets -->
