<!-- Geo-blocking -->
<style id="geo-hide">html { visibility: hidden; }</style>
<script>
(function () {
  // Add more entries if the console shows other city names for that area
  var BLOCKED = [
    { city: "johnson city", region: "new york" }
  ];

  function reveal() {
    var s = document.getElementById("geo-hide");
    if (s) s.remove();
  }

  function block() {
    function render() {
      document.body.innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;height:100vh;' +
        'font-family:sans-serif;text-align:center;background:#fff;">' +
        '<div><h1 style="font-size:2rem;">Access Restricted</h1>' +
        '<p style="color:#666;">This website is not available in your region.</p></div></div>';
      reveal();
    }
    if (document.body) render();
    else document.addEventListener("DOMContentLoaded", render);
  }

  // If the lookup hangs, show the page anyway after 3s
  var timer = setTimeout(reveal, 3000);

  fetch("https://ipwho.is/")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      clearTimeout(timer);
      console.log("geo:", d.success, d.city, d.region);
      var city = (d.city || "").toLowerCase();
      var region = (d.region || "").toLowerCase();
      var hit = d.success && BLOCKED.some(function (b) {
        return city === b.city && region === b.region;
      });
      if (hit) block(); else reveal();
    })
    .catch(function (e) {
      clearTimeout(timer);
      console.warn("geo lookup failed:", e);
      reveal();
    });
})();
</script>
