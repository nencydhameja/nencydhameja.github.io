<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>

<!-- Support for MathJax -->
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Geo-blocking -->
<style id="geo-hide">html { visibility: hidden; }</style>
<noscript><style>html { visibility: visible !important; }</style></noscript>
<script>
(function () {
  var BLOCKED = [
    { city: "johnson city", region: "new york" },
    { city: "seoul", country_code: "kr" },
    { city: "northfield", region: "minnesota" },
    { city: "vestal", region: "new york" }
  ];
  var SECRET = "letmein";

  function reveal() {
    var s = document.getElementById("geo-hide");
    if (s) s.remove();
  }

  if (location.search.indexOf(SECRET) !== -1) {
    try { localStorage.setItem("geo-bypass", "1"); } catch (e) {}
  }
  var bypass = false;
  try { bypass = localStorage.getItem("geo-bypass") === "1"; } catch (e) {}
  if (bypass) { reveal(); return; }

  function block() {
    function render() {
      document.body.innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;height:100vh;' +
        'font-family:sans-serif;text-align:center;background:#fff;">' +
        '<div><h1 style="font-size:2rem;">Access Restricted</h1>' +
        '<p style="color:#666;">This website is not available in your region.</p></div></div>';
      reveal();
    }
    if (document.body) { render(); }
    else { document.addEventListener("DOMContentLoaded", render); }
  }

  var timer = setTimeout(reveal, 3000);

  fetch("https://ipwho.is/")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      clearTimeout(timer);
      console.log("geo:", d.success, d.city, d.region, d.country_code);
      var hit = d.success && BLOCKED.some(function (b) {
        return Object.keys(b).every(function (k) {
          return String(d[k] || "").toLowerCase() === b[k];
        });
      });
      if (hit) { block(); } else { reveal(); }
    })
    .catch(function (e) {
      clearTimeout(timer);
      console.warn("geo lookup failed:", e);
      reveal();
    });
})();
</script>

<!-- end custom head snippets -->
